<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101811"><title>لعبة الدودة | Alaa Arcade</title><style>
*{box-sizing:border-box}body{margin:0;background:#101811;color:#f2f8ed;font-family:Tahoma,Arial,sans-serif;min-height:100dvh;padding:24px 16px;background-image:radial-gradient(ellipse at top,#263d23,transparent 65%)}main{max-width:560px;margin:auto}.brand{font:12px monospace;letter-spacing:3px;color:#bdd79c;text-align:center}h1{font-size:38px;text-align:center;margin:16px 0 8px}p{text-align:center;color:#a9b9a3;line-height:1.8;font-size:14px}.stats{display:flex;gap:12px;margin:24px 0 16px}.stat{flex:1;background:#ffffff08;border:1px solid #ffffff16;border-radius:16px;padding:14px;text-align:center}.stat small{color:#b5c6ad;display:block}.stat b{display:block;font:700 28px monospace;color:#d0f78b;margin-top:6px}.board{position:relative;background:#101d14;border:1px solid #506a3c;border-radius:20px;overflow:hidden;box-shadow:0 20px 65px #0005}canvas{display:block;width:100%;aspect-ratio:1;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#0b160de6;padding:30px;backdrop-filter:blur(3px)}.overlay[hidden]{display:none}.overlay h2{font-size:28px;margin:12px 0}.icon{font-size:48px}.primary{background:#c4ed82;color:#1d2b12;border:0;font-weight:bold;padding:15px 30px;border-radius:12px;cursor:pointer;font-size:16px}.toolbar{display:flex;justify-content:space-between;gap:12px;margin:16px 0;align-items:center}button,select{font:inherit}select,.secondary{background:#233220;color:#e9f6de;border:1px solid #597047;border-radius:10px;padding:11px;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #ebc46b;outline-offset:3px}.pad{display:grid;grid-template-columns:repeat(3,62px);gap:7px;justify-content:center;direction:ltr;margin:20px auto}.pad button{height:52px;border-radius:12px;border:1px solid #4d6540;background:#283e25;color:#def4be;font-size:24px;touch-action:manipulation}.pad button:active{background:#587540}.up{grid-column:2}.left{grid-column:1}.foot{font-size:11px;text-align:center;color:#84967b;padding-top:10px}a{color:#c4ed82}@media(max-width:400px){body{padding:16px 12px}h1{font-size:30px}.stats{margin-top:18px}.stat{padding:10px}}
</style></head><body><main><div class="brand" dir="ltr">ALAA / ARCADE — 01</div><h1>لعبة الدودة</h1><p>كُل التفاح، كبّر الدودة… واكسر رقمك القياسي.</p>
<div class="stats"><div class="stat"><small>النقاط</small><b id="score">0</b></div><div class="stat"><small>أفضل نتيجة</small><b id="best">0</b></div><div class="stat"><small>الطول</small><b id="length">3</b></div></div>
<div class="board"><canvas id="game" width="600" height="600" aria-label="ساحة لعبة الدودة. استخدم أزرار الاتجاهات أو اسحب على الشاشة"></canvas><div class="overlay" id="overlay"><div><div class="icon">🍏</div><h2 id="title">جاهز للتحدّي؟</h2><p id="message">تجنّب الحواف وجسم الدودة.<br>تحكّم بالأسهم أو اسحب بإصبعك.</p><button id="start" class="primary">ابدأ اللعب ←</button></div></div></div>
<div class="toolbar"><label>السرعة <select id="speed"><option value="170">هادية</option><option value="125" selected>عادية</option><option value="85">سريعة</option></select></label><button id="pause" class="secondary">إيقاف مؤقت</button><button id="restart" class="secondary">إعادة ↻</button></div>
<div class="pad" aria-label="أزرار التحكم"><button class="up" data-dir="up" aria-label="أعلى">↑</button><button class="left" data-dir="left" aria-label="يسار">←</button><button data-dir="down" aria-label="أسفل">↓</button><button data-dir="right" aria-label="يمين">→</button></div>
<p id="status" aria-live="polite">اضغط ابدأ اللعب.</p><div class="foot">الأسهم أو WASD للحركة · المسافة للإيقاف<br><br>صُنعت لعلاء جلال · <a href="../">العودة للموقع</a></div></main>
<script>
'use strict';
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),N=20,C=30;
let snake,dir,queue,food,score=0,best=0,state='ready',timer=null;
try{best=Number(localStorage.getItem('alaa-snake-best'))||0}catch{}
$('best').textContent=best;
const dirs={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function spawn(){const free=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});return free.length?free[Math.floor(Math.random()*free.length)]:null}
function reset(){clearTimeout(timer);snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir=dirs.right;queue=[];score=0;food=spawn();update();draw()}
function update(){$('score').textContent=score;$('length').textContent=snake.length;$('best').textContent=best}
function draw(){ctx.fillStyle='#101d14';ctx.fillRect(0,0,600,600);ctx.strokeStyle='#1d3020';ctx.lineWidth=1;for(let i=0;i<=N;i++){ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,600);ctx.moveTo(0,i*C);ctx.lineTo(600,i*C);ctx.stroke()}
if(food){ctx.fillStyle='#ef9274';ctx.beginPath();ctx.arc(food.x*C+15,food.y*C+16,10,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b5e97b';ctx.fillRect(food.x*C+15,food.y*C+2,4,7)}
snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#d6f99c':'#80b85e';ctx.beginPath();ctx.roundRect(s.x*C+2,s.y*C+2,26,26,i===0?9:6);ctx.fill();if(i===0){ctx.fillStyle='#1b3219';let px=-dir.y,py=dir.x;for(const z of [-1,1]){ctx.beginPath();ctx.arc(s.x*C+15+dir.x*6+px*z*5,s.y*C+15+dir.y*6+py*z*5,2.6,0,Math.PI*2);ctx.fill()}}})}
function schedule(){clearTimeout(timer);timer=setTimeout(tick,Number($('speed').value))}
function start(){reset();state='playing';$('overlay').hidden=true;$('pause').textContent='إيقاف مؤقت';$('status').textContent='يلا! اجمع التفاح وتجنّب الحواف.';schedule()}
function finish(won=false){state='over';clearTimeout(timer);$('title').textContent=won?'كسبت التحدّي!':'جرّب تاني!';$('message').textContent='جمعت '+score+' نقطة. أفضل نتيجة: '+best;$('start').textContent='العب مرة تانية ←';$('overlay').hidden=false;$('status').textContent=won?'مبروك! ملأت الساحة.':'انتهت الجولة. نتيجتك '+score+' نقطة.'}
function tick(){if(state!=='playing')return;if(queue.length)dir=queue.shift();const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=food&&head.x===food.x&&head.y===food.y;const body=eat?snake:snake.slice(0,-1);if(head.x<0||head.x>=N||head.y<0||head.y>=N||body.some(s=>s.x===head.x&&s.y===head.y)){finish();return}snake.unshift(head);if(eat){score+=10;if(score>best){best=score;try{localStorage.setItem('alaa-snake-best',String(best))}catch{}}food=spawn()}else snake.pop();update();draw();if(!food){finish(true);return}schedule()}
function turn(name){if(state!=='playing'||queue.length>=2)return;const next=dirs[name],last=queue.length?queue[queue.length-1]:dir;if(next.x===-last.x&&next.y===-last.y)return;if(next.x===last.x&&next.y===last.y)return;queue.push(next)}
function pause(){if(state==='playing'){state='paused';clearTimeout(timer);$('title').textContent='خُد نفسك';$('message').textContent='اللعبة متوقفة مؤقتًا.';$('start').textContent='كمّل اللعب ←';$('overlay').hidden=false;$('pause').textContent='استكمال';$('status').textContent='اللعبة متوقفة مؤقتًا.'}else if(state==='paused'){state='playing';$('overlay').hidden=true;$('pause').textContent='إيقاف مؤقت';$('status').textContent='كمّل التحدّي!';schedule()}}
$('start').onclick=()=>state==='paused'?pause():start();$('restart').onclick=start;$('pause').onclick=pause;
document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.dir)}));
document.addEventListener('keydown',e=>{if(e.target.tagName==='SELECT')return;const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};if(map[e.key]){e.preventDefault();turn(map[e.key])}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();pause()}});
let touch=null;canvas.addEventListener('pointerdown',e=>{touch={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointerup',e=>{if(!touch)return;const dx=e.clientX-touch.x,dy=e.clientY-touch.y;touch=null;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;turn(Math.abs(dx)>Math.abs(dy)?dx>0?'right':'left':dy>0?'down':'up')});canvas.addEventListener('pointercancel',()=>touch=null);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});
reset();
</script></body></html>
